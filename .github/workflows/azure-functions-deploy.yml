# Deploys function_app.py to an existing Python Function App.
#
# One-time setup (the workflow does not create the app):
#   1. Function App on a plan that allows the 1-hour timeout in host.json
#      (Premium or Dedicated). Stack: Python 3.11, the version used below.
#   2. App registration with a federated credential for this repo
#      (subject: repo:The-Launch-Box/earned-media-opportunity:ref:refs/heads/master)
#      and Website Contributor on the Function App.
#      That registration is the deploy identity. It is not the Graph app
#      (GRAPH_CLIENT_ID) and not the Function App's managed identity.
#   3. Repository secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   4. Repository variable: AZURE_FUNCTIONAPP_NAME
#
# Oryx installs requirements.txt on the app. .funcignore keeps tests, docs,
# .env, and local data out of the package. App settings and Key Vault stay
# on the Function App; this workflow only publishes code.

name: Deploy to Azure Functions

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Require Function App name
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
        run: |
          if [ -z "$AZURE_FUNCTIONAPP_NAME" ]; then
            echo "Set the AZURE_FUNCTIONAPP_NAME repository variable to the Function App name."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: .
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          respect-funcignore: true
